# PostgreSQL. Versions 9.5 and up are supported.
#
# 本デモは Docker Compose による開発を前提とする（要件定義書 §3.2）。
# 接続情報は compose.yaml の env から POSTGRES_* で渡し、DB 名のみを
# 環境ごとに切り替える。
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV["POSTGRES_HOST"] %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: rails_vector_db_demo_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: rails_vector_db_demo_test

production:
  primary: &primary_production
    <<: *default
    database: rails_vector_db_demo_production
    username: rails_vector_db_demo
    password: <%= ENV["RAILS_VECTOR_DB_DEMO_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: rails_vector_db_demo_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: rails_vector_db_demo_production_queue
    migrations_paths: db/queue_migrate
